title: "Simple matrix"
description: "A top level matrix will produce multiple documents for iteration."
---
matrix:
  os: [linux]
  arch: [x86_64, arm64]
  version: [18, 20]

name: "${os}-${arch}-v${version}"
---
arch: "x86_64"
name: "linux-x86_64-v18"
os: "linux"
version: 18
---
arch: "x86_64"
name: "linux-x86_64-v20"
os: "linux"
version: 20
---
arch: "arm64"
name: "linux-arm64-v18"
os: "linux"
version: 18
---
arch: "arm64"
name: "linux-arm64-v20"
os: "linux"
version: 20
